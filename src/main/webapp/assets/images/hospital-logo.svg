<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3663"/>
      <stop offset="100%" stop-color="#008080"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a88f"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a3663" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Logo Emblem: Shield + Medical Cross + Heartbeat Pulse Line -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Shield Outline -->
    <path d="M 40,5 C 65,5 75,15 75,35 C 75,60 40,75 40,75 C 40,75 5,60 5,35 C 5,15 15,5 40,5 Z" 
          fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2"/>
    
    <!-- White Clinical Cross Background -->
    <rect x="33" y="20" width="14" height="34" rx="3" fill="#ffffff"/>
    <rect x="23" y="30" width="34" height="14" rx="3" fill="#ffffff"/>

    <!-- Heartbeat Pulse Line Overlay in Emerald Green -->
    <path d="M 15,37 L 28,37 L 33,26 L 38,46 L 43,32 L 47,40 L 52,37 L 65,37" 
          fill="none" stroke="url(#crossGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Logo Typography -->
  <text x="100" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0a3663" letter-spacing="-0.5">
    SMART<tspan fill="#008080">HOSPITAL</tspan>
  </text>
  <text x="102" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.5">
    CARE & MEDICAL CENTER
  </text>
</svg>
